# Marks issues and pull requests stale after 60 days of inactivity and closes
# them 14 days later. https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 18 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has had no activity for 60 days and has been marked
            stale. It will be closed in 14 days unless there is new activity.
          stale-pr-message: >
            This pull request has had no activity for 60 days and has been
            marked stale. It will be closed in 14 days unless there is new
            activity.
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
