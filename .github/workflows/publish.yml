# Runs the full test suite on every push to main, then lets semantic-release
# publish a new version based on the conventional commit messages.
#
# npm publishing uses trusted publishing (OIDC), so no npm token is stored:
# the trusted publisher for this workflow is configured on npmjs.com under
# the package's Settings. The built-in GITHUB_TOKEN pushes the release
# commit and tag and creates the GitHub release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag, create the release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run semantic-release
